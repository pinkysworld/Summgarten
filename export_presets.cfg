codesign/codesign=3
privacy/microphone_usage_description="Der Klanggarten nimmt kurze Geräusche deines Kindes auf, damit daraus singende Pflanzen wachsen. Aufnahmen bleiben nur auf diesem Gerät."
codesign/entitlements/audio_input=true
privacy/microphone_usage_description_localized={
"en": "Sound Garden records short sounds from your child so singing plants can grow. Recordings stay on this device.",
"zh_CN": "声音花园会录下孩子的短小声音，让会唱歌的植物长出来。录音只保存在本设备上。",
"fr": "Le Jardin des Sons enregistre de courts sons de votre enfant pour faire pousser des plantes qui chantent. Les enregistrements restent sur cet appareil.",
"es": "El Jardín de Sonidos graba sonidos cortos de tu peque para que crezcan plantas que cantan. Las grabaciones se quedan en este dispositivo.",
"pt_BR": "O Jardim dos Sons grava sons curtos da criança para fazer crescer plantas que cantam. As gravações ficam neste aparelho.",
"ja": "おとのにわは、歌う植物を育てるためにお子さまの短い声を録音します。録音はこの端末だけに保存されます。",
"ru": "«Сад звуков» записывает короткие звуки ребёнка, чтобы выросли поющие растения. Записи остаются на этом устройстве.",
"pl": "Ogród Dźwięków nagrywa krótkie dźwięki dziecka, aby wyrosły śpiewające rośliny. Nagrania zostają na tym urządzeniu."
}

